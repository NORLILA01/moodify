<!doctype html>
<html lang="ms-MY" data-title-key="meta.deck.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodify: pembentangan NALI 2026</title>
<meta name="description" content="Pembentangan lapan slaid: alat latihan komunikasi untuk remaja Malaysia berumur 13–15 tahun.">
<link rel="stylesheet" href="presentation.css">
<link rel="stylesheet" href="../assets/css/moodify.css?v=20261021-3">
</head>
<body>
<div class="deck">
  <div class="viewport">
    <div class="canvas" id="canvas">

      <section class="slide" aria-roledescription="slide" data-title-literal="Moodify">
        <p class="kicker" data-i18n="deck.s1.kicker"></p>
        <h1>Moodify</h1>
        <p class="tagline" data-i18n="deck.s1.tagline"></p>
        <div class="msg msg--draft"><small data-i18n="deck.s1.draftLabel"></small><span data-i18n="deck.s1.draft"></span></div>
        <div class="pause" style="align-self:center"><span class="ic"><i></i><i></i></span><b data-i18n="deck.s1.pause"></b></div>
        <div class="msg msg--rev"><small data-i18n="deck.s1.revLabel"></small><span data-i18n="deck.s1.rev"></span></div>
        <p class="foot" data-i18n="deck.s1.foot"></p>
        <span class="num">1 / 8</span>
      </section>

      <section class="slide" aria-roledescription="slide" data-title-key="deck.s2.title" hidden>
        <h2 data-i18n="deck.s2.title"></h2>
        <div class="scenes">
          <div class="scene scene--main"><h3 data-i18n="deck.s2.c1h"></h3><p data-i18n="deck.s2.c1p"></p></div>
          <div class="scene"><h3 data-i18n="deck.s2.c2h"></h3><p data-i18n="deck.s2.c2p"></p></div>
          <div class="scene"><h3 data-i18n="deck.s2.c3h"></h3><p data-i18n="deck.s2.c3p"></p></div>
        </div>
        <p data-i18n="deck.s2.q"></p>
        <span class="num">2 / 8</span>
      </section>

      <section class="slide" aria-roledescription="slide" data-title-key="deck.s3.title" hidden>
        <h2 data-i18n="deck.s3.title"></h2>
        <div class="flow">
          <div class="step step--1"><b data-i18n="deck.s3.1t"></b><span data-i18n="deck.s3.1d"></span></div>
          <div class="step step--2"><b data-i18n="deck.s3.2t"></b><span data-i18n="deck.s3.2d"></span></div>
          <div class="step step--3"><b data-i18n="deck.s3.3t"></b><span data-i18n="deck.s3.3d"></span></div>
          <div class="step"><b data-i18n="deck.s3.4t"></b><span data-i18n="deck.s3.4d"></span></div><div class="step"><b data-i18n="deck.s3.5t"></b><span data-i18n="deck.s3.5d"></span></div>
        </div>
        <div class="roles">
          <div class="role role--ai"><b data-i18n="deck.s3.r1h"></b><span data-i18n="deck.s3.r1p"></span></div>
          <div class="role role--stu"><b data-i18n="deck.s3.r2h"></b><span data-i18n="deck.s3.r2p"></span></div>
          <div class="role role--edu"><b data-i18n="deck.s3.r3h"></b><span data-i18n="deck.s3.r3p"></span></div>
        </div>
        <p class="foot" data-i18n="deck.s3.foot"></p>
        <span class="num">3 / 8</span>
      </section>

      <section class="slide" aria-roledescription="slide" data-title-key="deck.s4.title" hidden>
        <h2 style="margin-bottom:14px" data-i18n="deck.s4.title"></h2>
        <p class="sit" data-i18n="deck.s4.situation"></p>
        <div class="cmp">
          <div class="card">
            <h3 data-i18n="deck.s4.draftLabel"></h3>
            <p class="q" lang="en">&ldquo;You are such an idiot. You never do your part.&rdquo;</p>
            <p class="gloss" data-i18n="deck.s4.glossDraft" data-i18n-hide-empty></p>
            <p class="refl" data-i18n="deck.s4.reflect"></p>
          </div>
          <div class="card card--rev">
            <h3 data-i18n="deck.s4.revLabel"></h3>
            <p class="q q--sm" lang="en">&ldquo;<mark>I'm frustrated<sup>A</sup></mark> that <mark>the slides aren't ready<sup>B</sup></mark> because our deadline is tomorrow. <mark>Can you send your section by 6 pm, or tell us what help you need?<sup>C</sup></mark>&rdquo;</p>
            <p class="gloss" data-i18n="deck.s4.glossRev" data-i18n-hide-empty></p>
            <p class="legend" data-i18n="deck.s4.legend"></p>
          </div>
        </div>
        <p class="foot"><span data-i18n="deck.s4.foot"></span> <a href="../#try" data-i18n="deck.s4.link"></a></p>
        <span class="num">4 / 8</span>
      </section>

      <section class="slide" aria-roledescription="slide" data-title-key="deck.s5.title" hidden>
        <h2 style="margin-bottom:18px" data-i18n="deck.s5.title"></h2>
        <div class="arch">
          <div class="zone zone--local">
            <h3 data-i18n="deck.s5.localH"></h3>
            <div class="chips">
              <div class="chip"><span data-i18n="deck.s5.c1"></span><small data-i18n="deck.s5.c1s"></small></div><span class="arr" aria-hidden="true">&darr;</span>
              <div class="chip"><span data-i18n="deck.s5.c2"></span><small data-i18n="deck.s5.c2s"></small></div><span class="arr" aria-hidden="true">&darr;</span>
              <div class="chip"><span data-i18n="deck.s5.c3"></span></div>
            </div>
            <div class="static" data-i18n="deck.s5.static"></div>
          </div>
          <div class="gap"><span data-i18n="deck.s5.gap1"></span><div class="dash"></div><span data-i18n="deck.s5.gap2"></span></div>
          <div class="zone zone--ext">
            <h3 data-i18n="deck.s5.extH"></h3>
            <div class="chips">
              <div class="chip"><span data-i18n="deck.s5.e1"></span><small data-i18n="deck.s5.e1s"></small></div><span class="arr" aria-hidden="true">&darr;</span>
              <div class="chip"><span data-i18n="deck.s5.e2"></span><small data-i18n="deck.s5.e2s"></small></div><span class="arr" aria-hidden="true">&darr;</span>
              <div class="chip"><span data-i18n="deck.s5.e3"></span><small data-i18n="deck.s5.e3s"></small></div>
            </div>
          </div>
        </div>
        <p class="note" data-i18n="deck.s5.note"></p>
        <span class="num">5 / 8</span>
      </section>

      <section class="slide" aria-roledescription="slide" data-title-key="deck.s6.title" hidden>
        <h2 style="margin-bottom:18px" data-i18n="deck.s6.title"></h2>
        <div class="evid">
          <div>
            <p class="kicker" style="margin-bottom:8px" data-i18n="deck.s6.kicker"></p>
            <table>
              <thead><tr><th data-i18n="deck.s6.h1"></th><th data-i18n="deck.s6.h2"></th><th data-i18n="deck.s6.h3"></th></tr></thead>
              <tbody><tr><td class="n">97,320</td><td class="n">0.60</td><td class="n">0.53</td></tr></tbody>
            </table>
            <p class="src" data-i18n="deck.s6.src"></p>
          </div>
          <div class="nm">
            <h3 data-i18n="deck.s6.nmH"></h3>
            <ul>
              <li data-i18n="deck.s6.nm1"></li>
              <li data-i18n="deck.s6.nm2"></li>
              <li data-i18n="deck.s6.nm3"></li>
            </ul>
            <p class="src" style="color:var(--warn-ink)" data-i18n="deck.s6.nmNote"></p>
          </div>
        </div>
        <span class="num">6 / 8</span>
      </section>

      <section class="slide" aria-roledescription="slide" data-title-key="deck.s7.title" hidden>
        <span class="badge" data-i18n="deck.s7.badge"></span>
        <h2 style="margin-bottom:14px" data-i18n="deck.s7.title"></h2>
        <div class="strip">
          <div><b>2 <span data-i18n="act.min"></span></b><span data-i18n="act.1"></span></div>
          <div><b>3 <span data-i18n="act.min"></span></b><span data-i18n="act.2"></span></div>
          <div><b>3 <span data-i18n="act.min"></span></b><span data-i18n="act.3"></span></div>
          <div><b>2 <span data-i18n="act.min"></span></b><span data-i18n="act.4"></span></div>
        </div>
        <div class="two">
          <div><h3 data-i18n="deck.s7.humanH"></h3><p data-i18n="deck.s7.humanP"></p></div>
          <div><h3 data-i18n="deck.s7.nextH"></h3><p data-i18n="deck.s7.nextP"></p></div>
        </div>
        <p class="foot" data-i18n="deck.s7.foot"></p>
        <span class="num">7 / 8</span>
      </section>

      <section class="slide" aria-roledescription="slide" data-title-key="deck.s8.title" hidden>
        <div class="close">
          <div>
            <h1 data-i18n="deck.s8.title"></h1>
            <p class="url"><a href="../" data-i18n="deck.s8.try"></a></p>
            
            <p class="foot" style="margin-top:28px" data-i18n="deck.s8.foot"></p>
          </div>
          
        </div>
        <span class="num">8 / 8</span>
      </section>

    </div>
  </div>

  <nav class="controls" aria-label="Kawalan slaid" data-i18n-attr="aria-label:deck.controls">
    <button type="button" id="prev" data-i18n="deck.prev"></button>
    <span class="pos" id="pos" role="status" aria-live="polite"></span>
    <button type="button" id="next" data-i18n="deck.next"></button>
    <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.group" aria-label="Bahasa / Language">
      <button type="button" class="lang-btn" data-set-lang="ms" lang="ms" aria-label="Bahasa Melayu" aria-pressed="true"><span aria-hidden="true">BM</span></button>
      <button type="button" class="lang-btn" data-set-lang="en" lang="en" aria-label="English" aria-pressed="false"><span aria-hidden="true">EN</span></button>
    </div>
    <a href="../" data-i18n="deck.back"></a>
  </nav>
</div>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/lang.js"></script>
<script src="presentation.js"></script>
</body>
</html>
