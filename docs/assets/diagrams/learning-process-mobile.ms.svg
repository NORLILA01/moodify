<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 870" role="img" lang="ms-MY" aria-labelledby="lpm-ms-t lpm-ms-d" font-family='Manrope, "Avenir Next", "Segoe UI", system-ui, -apple-system, Arial, sans-serif'>
<title id="lpm-ms-t">Proses pembelajaran: berhenti sejenak, renungkan, tulis semula, semak semula</title>
<desc id="lpm-ms-d">Empat langkah berturutan: Berhenti sejenak (tulis draf), Renungkan (semak maklum balas dan fikirkan kesannya), Tulis semula (guna perkataan sendiri), Semak semula (semak dan putuskan), dengan gelung putus-putus dari Semak semula kembali ke Tulis semula. Bimbingan AI pilihan menyokong langkah Renungkan hanya atas permintaan bagi draf yang ditandakan. Pendidik membimbing renungan dan membincangkan versi baharu. Tiada langkah menghantar mesej kepada orang lain.</desc>
<defs>
<marker id="lpm-ms-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#152B46"/></marker>
<marker id="lpm-ms-ms" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#152B46"/></marker>
</defs>
<rect width="420" height="870" fill="#F6F8FC"/><rect x="30" y="20" width="340" height="90" rx="14" fill="#FFD0A8" stroke="#152B46" stroke-width="2.5"/><text x="200" y="59.625" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="200" dy="0">1  Berhenti sejenak</tspan></text><text x="200" y="87.875" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Tulis draf</tspan></text><path d="M200 110 V158" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lpm-ms-m)"/><rect x="30" y="162" width="340" height="100" rx="14" fill="#EAF0FD" stroke="#152B46" stroke-width="2.5"/><text x="200" y="195.375" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="200" dy="0">2  Renungkan</tspan></text><text x="200" y="223.625" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Semak maklum balas dan</tspan><tspan x="200" dy="22.5">fikirkan kesannya</tspan></text><rect x="100" y="296" width="290" height="90" rx="14" fill="#FFFFFF" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="9 7"/><text x="245" y="327" text-anchor="middle" font-size="18" font-weight="800" fill="#152B46"><tspan x="245" dy="0">Bimbingan AI pilihan</tspan></text><text x="245" y="351.5" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="245" dy="0">Cadangan, hanya atas permintaan</tspan><tspan x="245" dy="18.75">untuk draf yang ditandakan</tspan></text><path d="M245 296 V266" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lpm-ms-m)"/><path d="M60 262 V420" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lpm-ms-m)"/><rect x="30" y="424" width="340" height="90" rx="14" fill="#E6F4EE" stroke="#0B6B63" stroke-width="2.5"/><text x="200" y="463.625" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="200" dy="0">3  Tulis semula</tspan></text><text x="200" y="491.875" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Guna perkataan sendiri</tspan></text><path d="M200 514 V562" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lpm-ms-m)"/><rect x="30" y="566" width="340" height="100" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="200" y="599.375" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="200" dy="0">4  Semak semula</tspan></text><text x="200" y="627.625" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Semak dan putuskan;</tspan><tspan x="200" dy="22.5">semak semula jika perlu</tspan></text><path d="M370 616 H392 V469 H374" fill="none" stroke="#152B46" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lpm-ms-m)"/><rect x="30" y="720" width="340" height="96" rx="14" fill="#FFFFFF" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="9 7"/><text x="200" y="754.75" text-anchor="middle" font-size="20" font-weight="800" fill="#152B46"><tspan x="200" dy="0">Pendidik</tspan></text><text x="200" y="781.75" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Membimbing renungan dan membincangkan</tspan><tspan x="200" dy="18.75">versi baharu serta pemikiran</tspan></text><text x="200" y="848" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Tiada langkah menghantar mesej kepada orang lain.</tspan></text>
</svg>
