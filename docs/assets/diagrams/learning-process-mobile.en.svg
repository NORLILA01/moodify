<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 870" role="img" lang="en" aria-labelledby="lpm-en-t lpm-en-d" font-family='Manrope, "Avenir Next", "Segoe UI", system-ui, -apple-system, Arial, sans-serif'>
<title id="lpm-en-t">Learning process: pause, reflect, rewrite, recheck</title>
<desc id="lpm-en-d">Four steps in a row: Pause (write a draft), Reflect (review feedback and consider its impact), Rewrite (use your own words), Recheck (review and decide), with a dashed loop from Recheck back to Rewrite. Optional AI coaching feeds Reflect only on request for a flagged draft. An educator guides reflection and discusses the revision. No step sends a message to another person.</desc>
<defs>
<marker id="lpm-en-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#152B46"/></marker>
<marker id="lpm-en-ms" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#152B46"/></marker>
</defs>
<rect width="420" height="870" fill="#F6F8FC"/><rect x="30" y="20" width="340" height="90" rx="14" fill="#FFD0A8" stroke="#152B46" stroke-width="2.5"/><text x="200" y="60.75" text-anchor="middle" font-size="24" font-weight="800" fill="#152B46"><tspan x="200" dy="0">1  Pause</tspan></text><text x="200" y="92.75" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Write a draft</tspan></text><path d="M200 110 V158" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lpm-en-m)"/><rect x="30" y="162" width="340" height="100" rx="14" fill="#EAF0FD" stroke="#152B46" stroke-width="2.5"/><text x="200" y="196.5" text-anchor="middle" font-size="24" font-weight="800" fill="#152B46"><tspan x="200" dy="0">2  Reflect</tspan></text><text x="200" y="228.5" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Review feedback and</tspan><tspan x="200" dy="22.5">consider its impact</tspan></text><rect x="100" y="296" width="290" height="90" rx="14" fill="#FFFFFF" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="9 7"/><text x="245" y="327" text-anchor="middle" font-size="18" font-weight="800" fill="#152B46"><tspan x="245" dy="0">Optional AI coaching</tspan></text><text x="245" y="351.5" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="245" dy="0">Suggestions, only on request</tspan><tspan x="245" dy="18.75">for a flagged draft</tspan></text><path d="M245 296 V266" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lpm-en-m)"/><path d="M60 262 V420" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lpm-en-m)"/><rect x="30" y="424" width="340" height="90" rx="14" fill="#E6F4EE" stroke="#0B6B63" stroke-width="2.5"/><text x="200" y="464.75" text-anchor="middle" font-size="24" font-weight="800" fill="#152B46"><tspan x="200" dy="0">3  Rewrite</tspan></text><text x="200" y="496.75" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Use your own words</tspan></text><path d="M200 514 V562" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lpm-en-m)"/><rect x="30" y="566" width="340" height="100" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="200" y="600.5" text-anchor="middle" font-size="24" font-weight="800" fill="#152B46"><tspan x="200" dy="0">4  Recheck</tspan></text><text x="200" y="632.5" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Review and decide;</tspan><tspan x="200" dy="22.5">revise again if useful</tspan></text><path d="M370 616 H392 V469 H374" fill="none" stroke="#152B46" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lpm-en-m)"/><rect x="30" y="720" width="340" height="96" rx="14" fill="#FFFFFF" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="9 7"/><text x="200" y="754.75" text-anchor="middle" font-size="20" font-weight="800" fill="#152B46"><tspan x="200" dy="0">Educator</tspan></text><text x="200" y="781.75" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">Guides reflection and discusses</tspan><tspan x="200" dy="18.75">the revision and reasoning</tspan></text><text x="200" y="848" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="200" dy="0">No step sends a message to another person.</tspan></text>
</svg>
