<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" lang="en" aria-labelledby="sa-en-t sa-en-d" font-family='Manrope, "Avenir Next", "Segoe UI", system-ui, -apple-system, Arial, sans-serif'>
<title id="sa-en-t">Current system architecture and data boundaries</title>
<desc id="sa-en-d">GitHub Pages serves the website, detector.js and model.json to the student's browser; these downloads are not a draft upload. Inside the browser, an English draft up to 500 characters is checked locally by a TF-IDF and logistic regression classifier, which produces feedback and local tips. Only if the student requests coaching for a flagged draft is the checked draft and its band sent to a Cloudflare Worker, which validates the request and keeps the API key secret, then calls OpenRouter and the configured language-model provider. Suggestions return to the browser and the student writes their own revision, with an optional local recheck.</desc>
<defs>
<marker id="sa-en-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#152B46"/></marker>
<marker id="sa-en-ms" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#152B46"/></marker>
</defs>
