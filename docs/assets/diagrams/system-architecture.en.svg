xt x="534" y="243.875" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="534" dy="0">Feedback</tspan></text><text x="534" y="272.125" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="534" dy="0">and local tips</tspan></text><path d="M214 248 H240" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-en-m)"/><path d="M434 248 H460" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-en-m)"/><rect x="332" y="350" width="272" height="96" rx="14" fill="#FFFFFF" stroke="#294BCC" stroke-width="2.5"/><text x="468" y="383.875" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="468" dy="0">Coaching request?</tspan></text><text x="468" y="412.125" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="468" dy="0">Student chooses, for a</tspan><tspan x="468" dy="20">flagged draft only</tspan></text><path d="M534 296 V346" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-en-m)"/><rect x="44" y="496" width="306" height="98" rx="14" fill="#FFFFFF" stroke="#0B6B63" stroke-width="2.5"/><text x="197" y="540.25" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="197" dy="0">Review suggestions</tspan></text><text x="197" y="568.5" text-anchor="middle" font-size="17" font-weight="500" fill="#3B4F68"><tspan x="197" dy="0">Write your own revision</tspan></text><path d="M352 446 L290 492" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-en-m)"/><text x="116" y="470" text-anchor="start" font-size="16" font-weight="600" fill="#3B4F68"><tspan x="116" dy="0">No external request</tspan></text><path d="M104 496 V330 H339 V300" fill="none" stroke="#152B46" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#sa-en-m)"/><text x="112" y="322" text-anchor="start" font-size="16" font-weight="600" fill="#3B4F68"><tspan x="112" dy="0">Optional local recheck</tspan></text><rect x="830" y="146" width="346" height="468" rx="18" fill="#EAF0FD" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="10 7"/><text x="1003" y="178" text-anchor="middle" font-size="18" font-weight="800" fill="#294BCC"><tspan x="1003" dy="0">External services:</tspan><tspan x="1003" dy="22.5">only for requested coaching</tspan></text><rect x="850" y="236" width="306" height="108" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="1003" y="275.875" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="1003" dy="0">Cloudflare Worker</tspan></text><text x="1003" y="304.125" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="1003" dy="0">Validates request;</tspan><tspan x="1003" dy="20">keeps API key secret</tspan></text><rect x="850" y="384" width="306" height="70" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="1003" y="426.875" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="1003" dy="0">OpenRouter</tspan></text><rect x="850" y="494" width="306" height="100" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="1003" y="539.5" text-anchor="middle" font-size="20" font-weight="800" fill="#152B46"><tspan x="1003" dy="0">Language-model provider</tspan></text><text x="1003" y="566.5" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="1003" dy="0">Configured model</tspan></text><path d="M1003 344 V380" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-en-m)" marker-start="url(#sa-en-ms)"/><path d="M1003 454 V490" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-en-m)" marker-start="url(#sa-en-ms)"/><path d="M604 398 H700 V286 H846" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#sa-en-m)"/><text x="708" y="224" text-anchor="start" font-size="16" font-weight="700" fill="#294BCC"><tspan x="708" dy="0">Yes: checked draft</tspan><tspan x="708" dy="20">and its band</tspan></text><path d="M850 332 H780 V545 H354" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#sa-en-m)"/><text x="372" y="570" text-anchor="start" font-size="16" font-weight="700" fill="#294BCC"><tspan x="372" dy="0">Suggestions return:</tspan><tspan x="372" dy="20">feeling or need, impact,</tspan><tspan x="372" dy="20">tip, sentence starter</tspan></text>
