<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1130" role="img" lang="ms-MY" aria-labelledby="sam-ms-t sam-ms-d" font-family='Manrope, "Avenir Next", "Segoe UI", system-ui, -apple-system, Arial, sans-serif'>
<title id="sam-ms-t">Seni bina sistem semasa dan sempadan data</title>
<desc id="sam-ms-d">GitHub Pages menghantar laman web, detector.js dan model.json ke pelayar pelajar; muat turun ini bukan muat naik draf. Dalam pelayar, draf bahasa Inggeris sehingga 500 aksara disemak secara setempat oleh pengelas TF-IDF dan regresi logistik, yang menghasilkan maklum balas dan petua setempat. Hanya jika pelajar meminta bimbingan bagi draf yang ditandakan, draf yang disemak dan kategorinya dihantar ke Cloudflare Worker, yang mengesahkan permintaan dan merahsiakan kunci API, kemudian memanggil OpenRouter dan penyedia model bahasa yang dikonfigurasikan. Cadangan kembali ke pelayar dan pelajar menulis versi baharunya sendiri, dengan semakan semula setempat yang dipilih.</desc>
<defs>
<marker id="sam-ms-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#152B46"/></marker>
<marker id="sam-ms-ms" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#152B46"/></marker>
</defs>
<rect width="420" height="1130" fill="#F6F8FC"/><rect x="30" y="14" width="360" height="78" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="210" y="48.875" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="210" dy="0">GitHub Pages</tspan></text><text x="210" y="77.125" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="210" dy="0">Laman web, detector.js, model.json</tspan></text><path d="M210 92 V132" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sam-ms-m)"/><text x="220" y="118" text-anchor="start" font-size="14" font-weight="600" fill="#3B4F68"><tspan x="220" dy="0">Fail statik, bukan draf</tspan></text><rect x="14" y="136" width="392" height="470" rx="16" fill="#E6F4EE" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="10 7"/><text x="30" y="166" text-anchor="start" font-size="16" font-weight="800" fill="#0B6B63"><tspan x="30" dy="0">Pelayar pelajar: pemprosesan setempat</tspan></text><rect x="40" y="184" width="340" height="70" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="210" y="215.125" text-anchor="middle" font-size="20" font-weight="800" fill="#152B46"><tspan x="210" dy="0">Draf bahasa Inggeris</tspan></text><text x="210" y="242.125" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="210" dy="0">Hingga 500 aksara</tspan></text><path d="M210 254 V286" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sam-ms-m)"/><rect x="40" y="290" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="210" y="326.125" text-anchor="middle" font-size="20" font-weight="800" fill="#152B46"><tspan x="210" dy="0">Pengelas setempat</tspan></text><text x="210" y="353.125" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="210" dy="0">TF-IDF + regresi logistik</tspan></text><path d="M210 370 V402" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sam-ms-m)"/><rect x="40" y="406" width="340" height="70" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="210" y="447.375" text-anchor="middle" font-size="17" font-weight="800" fill="#152B46"><tspan x="210" dy="0">Maklum balas dan petua setempat</tspan></text><path d="M210 476 V506" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sam-ms-m)"/><rect x="40" y="510" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#294BCC" stroke-width="2.5"/><text x="210" y="546.125" text-anchor="middle" font-size="20" font-weight="800" fill="#152B46"><tspan x="210" dy="0">Minta bimbingan?</tspan></text><text x="210" y="573.125" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="210" dy="0">Pelajar memilih, draf ditandakan sahaja</tspan></text><path d="M210 590 V640" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#sam-ms-m)"/><text x="222" y="622" text-anchor="start" font-size="14" font-weight="700" fill="#294BCC"><tspan x="222" dy="0">Ya: draf disemak + kategori</tspan></text><rect x="14" y="644" width="392" height="338" rx="16" fill="#EAF0FD" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="10 7"/><text x="30" y="668" text-anchor="start" font-size="14" font-weight="800" fill="#294BCC"><tspan x="30" dy="0">Perkhidmatan luar:</tspan><tspan x="30" dy="17.5">hanya untuk bimbingan yang diminta</tspan></text><rect x="40" y="698" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="210" y="734.125" text-anchor="middle" font-size="20" font-weight="800" fill="#152B46"><tspan x="210" dy="0">Cloudflare Worker</tspan></text><text x="210" y="761.125" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="210" dy="0">Mengesahkan; merahsiakan kunci API</tspan></text><path d="M210 778 V806" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sam-ms-m)" marker-start="url(#sam-ms-ms)"/><rect x="40" y="810" width="340" height="56" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="210" y="845.5" text-anchor="middle" font-size="20" font-weight="800" fill="#152B46"><tspan x="210" dy="0">OpenRouter</tspan></text><path d="M210 866 V892" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sam-ms-m)" marker-start="url(#sam-ms-ms)"/><rect x="40" y="896" width="340" height="70" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="210" y="926.75" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="210" dy="0">Penyedia model bahasa</tspan></text><text x="210" y="952.5" text-anchor="middle" font-size="15" font-weight="500" fill="#3B4F68"><tspan x="210" dy="0">Model yang dikonfigurasikan</tspan></text><path d="M210 982 V1020" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#sam-ms-m)"/><text x="222" y="1008" text-anchor="start" font-size="14" font-weight="700" fill="#294BCC"><tspan x="222" dy="0">Cadangan kembali</tspan></text><rect x="30" y="1024" width="360" height="84" rx="14" fill="#FFFFFF" stroke="#0B6B63" stroke-width="2.5"/><text x="210" y="1062.75" text-anchor="middle" font-size="20" font-weight="800" fill="#152B46"><tspan x="210" dy="0">Semak cadangan</tspan></text><text x="210" y="1089.75" text-anchor="middle" font-size="14" font-weight="500" fill="#3B4F68"><tspan x="210" dy="0">Tulis versi anda; semakan semula setempat pilihan</tspan></text>
</svg>
