<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" lang="ms-MY" aria-labelledby="sa-ms-t sa-ms-d" font-family='Manrope, "Avenir Next", "Segoe UI", system-ui, -apple-system, Arial, sans-serif'>
<title id="sa-ms-t">Seni bina sistem semasa dan sempadan data</title>
<desc id="sa-ms-d">GitHub Pages menghantar laman web, detector.js dan model.json ke pelayar pelajar; muat turun ini bukan muat naik draf. Dalam pelayar, draf bahasa Inggeris sehingga 500 aksara disemak secara setempat oleh pengelas TF-IDF dan regresi logistik, yang menghasilkan maklum balas dan petua setempat. Hanya jika pelajar meminta bimbingan bagi draf yang ditandakan, draf yang disemak dan kategorinya dihantar ke Cloudflare Worker, yang mengesahkan permintaan dan merahsiakan kunci API, kemudian memanggil OpenRouter dan penyedia model bahasa yang dikonfigurasikan. Cadangan kembali ke pelayar dan pelajar menulis versi baharunya sendiri, dengan semakan semula setempat yang dipilih.</desc>
<defs>
<marker id="sa-ms-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#152B46"/></marker>
<marker id="sa-ms-ms" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#152B46"/></marker>
</defs>
<rect width="1200" height="640" fill="#F6F8FC"/><rect x="24" y="14" width="440" height="84" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="244" y="51.75" text-anchor="middle" font-size="24" font-weight="800" fill="#152B46"><tspan x="244" dy="0">GitHub Pages</tspan></text><text x="244" y="83.75" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="244" dy="0">Laman web, detector.js, model.json</tspan></text><path d="M244 98 V142" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-ms-m)"/><text x="256" y="128" text-anchor="start" font-size="16" font-weight="600" fill="#3B4F68"><tspan x="256" dy="0">Fail statik dimuat turun; bukan muat naik draf</tspan></text><rect x="24" y="146" width="600" height="468" rx="18" fill="#E6F4EE" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="10 7"/><text x="44" y="178" text-anchor="start" font-size="19" font-weight="800" fill="#0B6B63"><tspan x="44" dy="0">Pelayar pelajar: pemprosesan setempat</tspan></text><rect x="44" y="200" width="170" height="96" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="129" y="231.25" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="129" dy="0">Draf bahasa</tspan><tspan x="129" dy="23.75">Inggeris</tspan></text><text x="129" y="280.75" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="129" dy="0">Hingga 500 aksara</tspan></text><rect x="244" y="200" width="190" height="96" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="339" y="221.25" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="339" dy="0">Pengelas</tspan><tspan x="339" dy="23.75">setempat</tspan></text><text x="339" y="270.75" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="339" dy="0">TF-IDF +</tspan><tspan x="339" dy="20">regresi logistik</tspan></text><rect x="464" y="200" width="140" height="96" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="534" y="233.125" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="534" dy="0">Maklum balas</tspan></text><text x="534" y="258.875" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="534" dy="0">dan petua</tspan><tspan x="534" dy="20">setempat</tspan></text><path d="M214 248 H240" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-ms-m)"/><path d="M434 248 H460" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-ms-m)"/><rect x="332" y="350" width="272" height="96" rx="14" fill="#FFFFFF" stroke="#294BCC" stroke-width="2.5"/><text x="468" y="383.125" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="468" dy="0">Minta bimbingan?</tspan></text><text x="468" y="408.875" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="468" dy="0">Pelajar memilih, hanya</tspan><tspan x="468" dy="20">untuk draf ditandakan</tspan></text><path d="M534 296 V346" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-ms-m)"/><rect x="44" y="496" width="306" height="98" rx="14" fill="#FFFFFF" stroke="#0B6B63" stroke-width="2.5"/><text x="197" y="539.5" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="197" dy="0">Semak cadangan</tspan></text><text x="197" y="565.25" text-anchor="middle" font-size="17" font-weight="500" fill="#3B4F68"><tspan x="197" dy="0">Tulis versi anda sendiri</tspan></text><path d="M352 446 L290 492" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-ms-m)"/><text x="116" y="470" text-anchor="start" font-size="16" font-weight="600" fill="#3B4F68"><tspan x="116" dy="0">Tiada permintaan luar</tspan></text><path d="M104 496 V330 H339 V300" fill="none" stroke="#152B46" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#sa-ms-m)"/><text x="112" y="322" text-anchor="start" font-size="16" font-weight="600" fill="#3B4F68"><tspan x="112" dy="0">Semakan semula setempat (pilihan)</tspan></text><rect x="830" y="146" width="346" height="468" rx="18" fill="#EAF0FD" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="10 7"/><text x="1003" y="178" text-anchor="middle" font-size="18" font-weight="800" fill="#294BCC"><tspan x="1003" dy="0">Perkhidmatan luar:</tspan><tspan x="1003" dy="22.5">hanya untuk bimbingan yang diminta</tspan></text><rect x="850" y="236" width="306" height="108" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="1003" y="275.125" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="1003" dy="0">Cloudflare Worker</tspan></text><text x="1003" y="300.875" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="1003" dy="0">Mengesahkan permintaan;</tspan><tspan x="1003" dy="20">merahsiakan kunci API</tspan></text><rect x="850" y="384" width="306" height="70" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="1003" y="426.125" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="1003" dy="0">OpenRouter</tspan></text><rect x="850" y="494" width="306" height="100" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="1003" y="538.75" text-anchor="middle" font-size="18" font-weight="800" fill="#152B46"><tspan x="1003" dy="0">Penyedia model bahasa</tspan></text><text x="1003" y="563.25" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="1003" dy="0">Model yang dikonfigurasikan</tspan></text><path d="M1003 344 V380" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-ms-m)" marker-start="url(#sa-ms-ms)"/><path d="M1003 454 V490" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#sa-ms-m)" marker-start="url(#sa-ms-ms)"/><path d="M604 398 H700 V286 H846" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#sa-ms-m)"/><text x="708" y="224" text-anchor="start" font-size="16" font-weight="700" fill="#294BCC"><tspan x="708" dy="0">Ya: draf</tspan><tspan x="708" dy="20">disemak dan</tspan><tspan x="708" dy="20">kategorinya</tspan></text><path d="M850 332 H780 V545 H354" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#sa-ms-m)"/><text x="372" y="570" text-anchor="start" font-size="16" font-weight="700" fill="#294BCC"><tspan x="372" dy="0">Cadangan kembali:</tspan><tspan x="372" dy="20">perasaan atau keperluan,</tspan><tspan x="372" dy="20">kesan, petua, pembuka ayat</tspan></text>
</svg>
