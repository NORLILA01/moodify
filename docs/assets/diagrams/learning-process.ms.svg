<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" role="img" lang="ms-MY" aria-labelledby="lp-ms-t lp-ms-d" font-family='Manrope, "Avenir Next", "Segoe UI", system-ui, -apple-system, Arial, sans-serif'>
<title id="lp-ms-t">Proses pembelajaran: berhenti sejenak, renungkan, tulis semula, semak semula</title>
<desc id="lp-ms-d">Empat langkah berturutan: Berhenti sejenak (tulis draf), Renungkan (semak maklum balas dan fikirkan kesannya), Tulis semula (guna perkataan sendiri), Semak semula (semak dan putuskan), dengan gelung putus-putus dari Semak semula kembali ke Tulis semula. Bimbingan AI pilihan menyokong langkah Renungkan hanya atas permintaan bagi draf yang ditandakan. Pendidik membimbing renungan dan membincangkan versi baharu. Tiada langkah menghantar mesej kepada orang lain.</desc>
<defs>
<marker id="lp-ms-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#152B46"/></marker>
<marker id="lp-ms-ms" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#152B46"/></marker>
</defs>
<rect width="1200" height="524" fill="#F6F8FC"/><rect x="12" y="170" width="252" height="110" rx="14" fill="#FFD0A8" stroke="#152B46" stroke-width="2.5"/><text x="138" y="219.625" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="138" dy="0">1  Berhenti sejenak</tspan></text><text x="138" y="247.875" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="138" dy="0">Tulis draf</tspan></text><rect x="318" y="170" width="252" height="110" rx="14" fill="#EAF0FD" stroke="#152B46" stroke-width="2.5"/><text x="444" y="208.375" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="444" dy="0">2  Renungkan</tspan></text><text x="444" y="236.625" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="444" dy="0">Semak maklum balas dan</tspan><tspan x="444" dy="22.5">fikirkan kesannya</tspan></text><rect x="624" y="170" width="252" height="110" rx="14" fill="#E6F4EE" stroke="#0B6B63" stroke-width="2.5"/><text x="750" y="219.625" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="750" dy="0">3  Tulis semula</tspan></text><text x="750" y="247.875" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="750" dy="0">Guna perkataan sendiri</tspan></text><rect x="930" y="170" width="252" height="110" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="1056" y="219.625" text-anchor="middle" font-size="21" font-weight="800" fill="#152B46"><tspan x="1056" dy="0">4  Semak semula</tspan></text><text x="1056" y="247.875" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="1056" dy="0">Semak dan putuskan</tspan></text><path d="M264 225 H314" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lp-ms-m)"/><path d="M570 225 H620" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lp-ms-m)"/><path d="M876 225 H926" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lp-ms-m)"/><path d="M1056 170 C1056 100 750 100 750 166" fill="none" stroke="#152B46" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lp-ms-m)"/><text x="903" y="92" text-anchor="middle" font-size="18" font-weight="600" fill="#3B4F68"><tspan x="903" dy="0">Semak semula jika perlu</tspan></text><rect x="318" y="10" width="252" height="76" rx="14" fill="#FFFFFF" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="9 7"/><text x="444" y="43.125" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="444" dy="0">Bimbingan AI pilihan</tspan></text><text x="444" y="68.875" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="444" dy="0">Cadangan, bukan penghakiman</tspan></text><path d="M444 86 V166" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lp-ms-m)"/><text x="458" y="122" text-anchor="start" font-size="17" font-weight="600" fill="#3B4F68"><tspan x="458" dy="0">Hanya atas permintaan</tspan><tspan x="458" dy="21.25">untuk draf yang ditandakan</tspan></text><rect x="440" y="392" width="360" height="84" rx="14" fill="#FFFFFF" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="9 7"/><text x="620" y="429.625" text-anchor="middle" font-size="22" font-weight="800" fill="#152B46"><tspan x="620" dy="0">Pendidik</tspan></text><text x="620" y="459.125" text-anchor="middle" font-size="17" font-weight="500" fill="#3B4F68"><tspan x="620" dy="0">Membincangkan pilihan dan pemikiran</tspan></text><path d="M520 392 L438 284" fill="none" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lp-ms-m)"/><path d="M720 392 L756 284" fill="none" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lp-ms-m)"/><text x="452" y="336" text-anchor="end" font-size="17" font-weight="600" fill="#3B4F68"><tspan x="452" dy="0">Membimbing renungan</tspan></text><text x="756" y="340" text-anchor="start" font-size="17" font-weight="600" fill="#3B4F68"><tspan x="756" dy="0">Membincangkan versi baharu</tspan></text><text x="600" y="508" text-anchor="middle" font-size="17" font-weight="500" fill="#3B4F68"><tspan x="600" dy="0">Tiada langkah dalam proses ini yang menghantar mesej kepada orang lain.</tspan></text>
</svg>
