<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" role="img" lang="en" aria-labelledby="lp-en-t lp-en-d" font-family='Manrope, "Avenir Next", "Segoe UI", system-ui, -apple-system, Arial, sans-serif'>
<title id="lp-en-t">Learning process: pause, reflect, rewrite, recheck</title>
<desc id="lp-en-d">Four steps in a row: Pause (write a draft), Reflect (review feedback and consider its impact), Rewrite (use your own words), Recheck (review and decide), with a dashed loop from Recheck back to Rewrite. Optional AI coaching feeds Reflect only on request for a flagged draft. An educator guides reflection and discusses the revision. No step sends a message to another person.</desc>
<defs>
<marker id="lp-en-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#152B46"/></marker>
<marker id="lp-en-ms" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#152B46"/></marker>
</defs>
<rect width="1200" height="524" fill="#F6F8FC"/><rect x="12" y="170" width="252" height="110" rx="14" fill="#FFD0A8" stroke="#152B46" stroke-width="2.5"/><text x="138" y="220.75" text-anchor="middle" font-size="24" font-weight="800" fill="#152B46"><tspan x="138" dy="0">1  Pause</tspan></text><text x="138" y="252.75" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="138" dy="0">Write a draft</tspan></text><rect x="318" y="170" width="252" height="110" rx="14" fill="#EAF0FD" stroke="#152B46" stroke-width="2.5"/><text x="444" y="209.5" text-anchor="middle" font-size="24" font-weight="800" fill="#152B46"><tspan x="444" dy="0">2  Reflect</tspan></text><text x="444" y="241.5" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="444" dy="0">Review feedback and</tspan><tspan x="444" dy="22.5">consider its impact</tspan></text><rect x="624" y="170" width="252" height="110" rx="14" fill="#E6F4EE" stroke="#0B6B63" stroke-width="2.5"/><text x="750" y="220.75" text-anchor="middle" font-size="24" font-weight="800" fill="#152B46"><tspan x="750" dy="0">3  Rewrite</tspan></text><text x="750" y="252.75" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="750" dy="0">Use your own words</tspan></text><rect x="930" y="170" width="252" height="110" rx="14" fill="#FFFFFF" stroke="#152B46" stroke-width="2.5"/><text x="1056" y="220.75" text-anchor="middle" font-size="24" font-weight="800" fill="#152B46"><tspan x="1056" dy="0">4  Recheck</tspan></text><text x="1056" y="252.75" text-anchor="middle" font-size="18" font-weight="500" fill="#3B4F68"><tspan x="1056" dy="0">Review and decide</tspan></text><path d="M264 225 H314" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lp-en-m)"/><path d="M570 225 H620" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lp-en-m)"/><path d="M876 225 H926" fill="none" stroke="#152B46" stroke-width="2.5" marker-end="url(#lp-en-m)"/><path d="M1056 170 C1056 100 750 100 750 166" fill="none" stroke="#152B46" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lp-en-m)"/><text x="903" y="92" text-anchor="middle" font-size="18" font-weight="600" fill="#3B4F68"><tspan x="903" dy="0">Revise again if useful</tspan></text><rect x="318" y="10" width="252" height="76" rx="14" fill="#FFFFFF" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="9 7"/><text x="444" y="43.125" text-anchor="middle" font-size="19" font-weight="800" fill="#152B46"><tspan x="444" dy="0">Optional AI coaching</tspan></text><text x="444" y="68.875" text-anchor="middle" font-size="16" font-weight="500" fill="#3B4F68"><tspan x="444" dy="0">Suggestions, not a verdict</tspan></text><path d="M444 86 V166" fill="none" stroke="#294BCC" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lp-en-m)"/><text x="458" y="122" text-anchor="start" font-size="17" font-weight="600" fill="#3B4F68"><tspan x="458" dy="0">Only on request</tspan><tspan x="458" dy="21.25">for a flagged draft</tspan></text><rect x="440" y="392" width="360" height="84" rx="14" fill="#FFFFFF" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="9 7"/><text x="620" y="429.625" text-anchor="middle" font-size="22" font-weight="800" fill="#152B46"><tspan x="620" dy="0">Educator</tspan></text><text x="620" y="459.125" text-anchor="middle" font-size="17" font-weight="500" fill="#3B4F68"><tspan x="620" dy="0">Discusses choices and reasoning</tspan></text><path d="M520 392 L438 284" fill="none" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lp-en-m)"/><path d="M720 392 L756 284" fill="none" stroke="#0B6B63" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#lp-en-m)"/><text x="452" y="336" text-anchor="end" font-size="17" font-weight="600" fill="#3B4F68"><tspan x="452" dy="0">Guides reflection</tspan></text><text x="756" y="340" text-anchor="start" font-size="17" font-weight="600" fill="#3B4F68"><tspan x="756" dy="0">Discusses the revision</tspan></text><text x="600" y="508" text-anchor="middle" font-size="17" font-weight="500" fill="#3B4F68"><tspan x="600" dy="0">Nothing in this process sends a message to another person.</tspan></text>
</svg>
